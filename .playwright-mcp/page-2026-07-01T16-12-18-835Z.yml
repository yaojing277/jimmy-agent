          - listitem [ref=f203e188]:
            - heading "現金股利" [level=5] [ref=f203e189]
            - paragraph [ref=f203e190]: 定義：公司將部分盈餘以現金方式發放給股東的收益。
            - paragraph [ref=f203e191]: 現金股利可視為利息般的實質現金收益， 當公司的盈餘因應自身投資需求還有剩餘， 通常會以現金股利的方式回饋股東。 因此當企業處於成長需要大量再投資，現金股息發配就會較少； 當企業處於成熟期沒有太多成長機會，現金股息發配就會較多，所以不能單純用殖利率來判斷公司好壞。
          - listitem [ref=f203e192]:
            - heading "股票股利" [level=5] [ref=f203e193]
            - paragraph [ref=f203e194]: 定義：公司將盈餘轉成增資，以股票形式分配給股東。
            - paragraph [ref=f203e195]: 盈餘是屬於股東的投資成果， 如果企業因應成長所需，希望將盈餘留在公司內做廠房、設備等再投資， 可透過發配股票股利的方式，以股票換取原本應該分配股東的盈餘。 因此股票股利是將股東盈餘留在企業的手段，會讓股本和淨值膨脹。 當企業處於成長需要大量再投資，股票股利發配就會較多； 當企業處於成熟期沒有成長機會，股票股利發配就會較少。
