              - heading "API：程式和程式之間的暗號" [level=3] [ref=e173]
              - paragraph [ref=e174]:
                - text: API（Application Programming Interface，
                - strong [ref=e175]: 應用程式介面
                - text: ）就是「
                - strong [ref=e176]: 讓程式可以呼叫另一個程式的接口
                - text: 」。
              - paragraph [ref=e177]:
                - text: 想像你要寄一封 email：打開 Gmail、點「撰寫」、填收件人、打內容、按傳送。這是人類的方式，也就是
                - strong [ref=e178]: GUI
                - text: （Graphical User Interface，
                - strong [ref=e179]: 圖形使用者介面
                - text: ），我們看著畫面點來點去，是最直覺的操作。
              - paragraph [ref=e180]: 但你每按一個按鈕，Gmail 背後其實都在呼叫 Google 的 API。那個漂亮的介面，只是把「呼叫 API」這件事包裝成你看得懂的按鈕。
              - paragraph [ref=e181]:
                - strong [ref=e182]: 如果你能讓 AI Agent 直接透過 API 控制，你其實就不用自己繞一圈去按按鈕？
              - paragraph [ref=e183]: 這就是 AI 時代最核心的觀念轉換，讓軟體的操作回到本質、最簡單直接的作法。
              - heading "CLI：API 的人性化版本" [level=3] [ref=e184]
              - paragraph [ref=e185]:
                - text: CLI（Command Line Interface，
                - strong [ref=e186]: 命令列介面
                - text: ）就是在終端機裡打指令。
              - paragraph [ref=e187]: 它介於 API 和 GUI 之間 — 沒有漂亮畫面，但用人類看得懂的語言文字，例如：
              - code [ref=e189]: gmail send --to boss@company.com --subject "月報" --body "附件如附"
              - paragraph [ref=e190]: 一行指令搞定。不用打開 Gmail、不用等畫面載入、不用點撰寫再填四個欄位。
              - paragraph [ref=e191]: CLI 在 AI 時代特別重要的三個理由：
              - list [ref=e192]:
                - listitem [ref=e193]:
                  - strong [ref=e194]: 比 GUI 穩定
                  - text: ：App 會改版、按鈕會搬家，但指令格式幾乎不會變
                - listitem [ref=e195]:
                  - strong [ref=e196]: 比 Browser Use 快
                  - text: ：不用打開瀏覽器、等頁面載入
                - listitem [ref=e197]:
                  - strong [ref=e198]: 比 API 更適合 AI 使用
                  - text: ：指令是簡單英文單字，AI 不容易寫錯
              - heading "MCP：幫 AI 預先包好的工具包" [level=3] [ref=e199]
              - paragraph [ref=e200]:
                - text: MCP（Model Context Protocol，
                - strong [ref=e201]: 模型上下文協議
                - text: ）是 2024 年底 Anthropic 提出的開放標準。
              - paragraph [ref=e202]:
                - emphasis [ref=e203]: ※ 未來我也會寫一篇《MCP 入門與推薦》文章，推薦一些我有安裝的 MCP。
              - paragraph [ref=e204]:
                - text: 讓我先簡單說：
                - strong [ref=e205]: MCP 就是有人幫你把 API 和 CLI 包裝成 AI 可以直接拿來用的工具。
              - paragraph [ref=e206]: 沒有 MCP 的時候，AI 要先去查文件、搞懂 API 格式、寫程式呼叫；有了 MCP，AI 直接從工具清單裡挑一個來用，幾秒搞定。
              - paragraph [ref=e207]:
                - strong [ref=e208]:
                  - mark [ref=e209]: 但 MCP 也有它的限制，不是什麼都用 MCP
                - text: ：
              - list [ref=e210]:
                - listitem [ref=e211]: 要等別人開發 MCP Server 你才能用
                - listitem [ref=e212]: 不是所有 AI 工具都完整支援
                - listitem [ref=e213]: 裝太多 MCP 會佔用 AI 的記憶空間（Context Window，上下文窗口）
              - generic [ref=e214]:
                - paragraph [ref=e215]:
                  - text: 舉個實際案例來說：
                  - strong [ref=e216]: Notion 官方推出的 MCP
                  - superscript [ref=e217]:
                    - link "2" [ref=e218] [cursor=pointer]:
                      - /url: "#634bcb87-fd89-48ae-a4be-eb5089921c9d"
                  - strong [ref=e219]: 就比 Notion API（Application Programming Interface）功能少蠻多的；WordPress 也是
                  - text: 。
                - paragraph [ref=e220]: 所以這兩個工具，我都還是用 API，功能全面，反正你也是叫 AI Agent 幫你讀官方的 API 文檔，也不是你自己讀，重點是功能權限能不能全開。
                - paragraph [ref=e221]: 所以我一律都建議，直接讓 AI 幫你查：「你要的工具，在 MCP 跟 API 上，功能跟使用上的差異？」
                - paragraph [ref=e222]: 它會直接評估後告訴你，哪個是更好的選擇，該怎麼做。
              - figure "當你要安裝 MCP 前，可以直接問 AI，讓它給你比較表格最準" [ref=e224]:
                - link "wordpress mcp vs api differences 2026 03 18 1" [ref=e225] [cursor=pointer]:
                  - /url: https://raymondhouch.com/wp-content/uploads/2026/03/wordpress-mcp-vs-api-differences-2026-03-18-1.jpg
                  - img "wordpress mcp vs api differences 2026 03 18 1" [ref=e226]
                - generic [ref=e227]: 當你要安裝 MCP 前，可以直接問 AI，讓它給你比較表格最準
              - heading "Browser Use：最後才用的大絕招" [level=3] [ref=e228]
              - paragraph [ref=e229]:
                - text: Browser Use（
                - strong [ref=e230]: 瀏覽器自動化操控
                - text: ）就是讓 AI 打開瀏覽器，像真人一樣操作網頁，點按鈕、填表單、截圖。
              - paragraph [ref=e231]:
                - text: 技術上常用的工具包括
                - code [ref=e232]: Playwright
                - text: 和
                - code [ref=e233]: Puppeteer
                - text: 這類瀏覽器自動化框架。
              - paragraph [ref=e234]:
                - text: 聽起來很厲害對吧？但老實說，這是
                - strong [ref=e235]: 所有方式裡面最慢、最不穩定的
                - text: 。
              - paragraph [ref=e236]: 為什麼？因為網頁會改版。今天那個按鈕在左邊，明天改版可能搬到右邊，AI 就找不到了。
              - paragraph [ref=e237]: 打個比方來說，你讓 AI 控制瀏覽器來發一篇電子報、填寫表單，大概要花上 5~10 分鐘，但透過 API 可能是幾秒鐘的任務。
              - figure [ref=e238]:
                - link "讓 AI 模仿人類操作 vs 讓 AI 直接跟系統對話" [ref=e239] [cursor=pointer]:
                  - /url: https://raymondhouch.com/wp-content/uploads/2026/03/ai-software-control-metaphor-scaled.jpg
                  - img "讓 AI 模仿人類操作 vs 讓 AI 直接跟系統對話" [ref=e240]
              - separator [ref=e241]: ...
              - generic [ref=e242]:
                - paragraph [ref=e243]:
                  - strong [ref=e244]: 🔥 早鳥預購中｜
                  - link "24 小時開始活用 Claude Code" [ref=e245] [cursor=pointer]:
                    - /url: https://lifehacker.tw/courses/24hr-claude-code-tutorial?affcode=blog
                    - strong [ref=e246]: 24 小時開始活用 Claude Code
                - paragraph [ref=e247]:
                  - strong [ref=e248]: 為什麼大多數人裝完之後就放著沒用？因為你的 AI Agent 一開始太空白、你也不知道從何訓練。
                - paragraph [ref=e249]:
                  - text: 以我們 8 年的教學，超過 10,000 名學員在
                  - link "數位工作術" [ref=e250] [cursor=pointer]:
                    - /url: http://lifehacker.tw
                  - text: 的經驗，這次特別設計課程機制：
                - paragraph [ref=e251]:
                  - text: 這堂迷你課，設計為
                  - strong [ref=e252]: 可以直接餵給 Claude Code，它會快速學會這些「武功秘笈」
                  - text: ！
                - paragraph [ref=e253]: 幫助、引導你做好前期配置，打造出「好用的 AI 分身助理」。
                - paragraph [ref=e254]: 讓你不用自己讀每篇文章，當然你也可以讀，跟你的 AI 一起進化。
                - paragraph [ref=e255]:
                  - text: 內容皆為我們真實場景的完整教學，
                  - strong [ref=e256]: 不只告訴你「怎麼做」，更告訴你我們踩過什麼坑、怎麼解決的？
                - figure [ref=e257]:
                  - link "claude code package 0409" [ref=e258] [cursor=pointer]:
                    - /url: https://lifehacker.tw/courses/24hr-claude-code-tutorial?affcode=blog
                    - img "claude code package 0409" [ref=e259]
              - separator [ref=e260]: ...
              - heading "我的實戰經驗：選錯路線的代價" [level=2] [ref=e261]
              - paragraph [ref=e262]: 跑了半年 AI 助理之後，我踩過的坑可以整理成一條很清楚的優先順序：
              - blockquote [ref=e263]:
                - paragraph [ref=e264]:
                  - text: 能用 API / CLI → 就不要用 MCP
                  - text: 能用 MCP → 就不要用 Browser Use
                  - text: Browser Use → 是真的沒有其他路的最後手段
              - heading "案例一：爬文 or 抓個人 Notion 內容" [level=3] [ref=e265]
              - list [ref=e266]:
                - listitem [ref=e267]:
                  - strong [ref=e268]: 錯誤路線
                  - text: ：用 Playwright（瀏覽器自動化工具）打開 Notion 網頁 → 載入慢、格式亂、常常失敗
                - listitem [ref=e269]:
                  - strong [ref=e270]: 正確路線
                  - text: ：用 Notion API→ 3 秒拿到完美結構化資料；別人的網頁用 Firecrawl
                  - superscript [ref=e271]:
                    - link "3" [ref=e272] [cursor=pointer]:
                      - /url: "#34c4ef09-3bcc-4335-aa0d-b9922fba85c6"
              - heading "案例二：抓別人的 Facebook 貼文" [level=3] [ref=e273]
              - list [ref=e274]:
                - listitem [ref=e275]:
                  - strong [ref=e276]: 沒有 API 可用
                  - text: （Facebook 不開放抓別人的貼文）
                - listitem [ref=e277]:
                  - strong [ref=e278]: 正確路線
                  - text: ：這時候才用 Playwright（瀏覽器自動化）打開頁面去抓
              - paragraph [ref=e279]: 看到了嗎？Browser Use（瀏覽器自動化）不是不好，而是它應該是你「沒有其他路」的時候才走的路。
              - separator [ref=e280]: ...
              - heading "那 Agent-Browser 呢？用 AI 操控桌面 App" [level=2] [ref=e281]
              - paragraph [ref=e282]:
                - text: 最近還有一個新工具叫
                - link "agent-browser" [ref=e283] [cursor=pointer]:
                  - /url: https://github.com/vercel-labs/agent-browser
                - text: ，它可以讓 AI 直接操控 Electron 架構的桌面 App：Slack、Discord、VS Code、甚至 Obsidian
                - superscript [ref=e284]:
                  - link "4" [ref=e285] [cursor=pointer]:
                    - /url: "#5b72d93c-0510-40db-bdab-b1ae944291bd"
                - text: 。
              - paragraph [ref=e286]:
                - text: ※ 背後原理是： 幾乎所有 Electron 架構的應用程式都會暴露 Chrome DevTools Protocol（CDP，Chrome 開發者工具協議）埠口（常見如
                - code [ref=e287]: "--remote-debugging-port=9222"
                - text: ）。 只要開啟這個偵錯埠口，我們熟悉的瀏覽器自動化工具（例如 Playwright）就能像控制 Headless Chrome 一樣去操控桌面軟體了。
              - figure "agent-browser 操控 Slack 桌面版的示範" [ref=e288]:
                - generic [ref=e290]: agent-browser 操控 Slack 桌面版的示範
              - paragraph [ref=e291]:
                - text: 聽起來很酷，但我的判斷是：
                - strong [ref=e292]: 對大部分人來說，目前不需要。
              - paragraph [ref=e293]: 原因和 Browser Use 一樣 — 如果這些軟體已經有 API 或 CLI，直接用就好了。我用 Discord Bot API 發訊息，比讓 AI 打開 Discord App 去點按鈕快一百倍。
              - paragraph [ref=e294]:
                - strong [ref=e295]: agent-browser 真正有價值的場景
                - text: ：某個軟體完全沒有 API，也沒有 CLI，你又非得自動化不可。這種情況在企業內部的老系統比較常見，一般人很少遇到。
              - separator [ref=e296]: ...
              - blockquote [ref=e297]:
                - paragraph [ref=e298]:
                  - text: 延伸閱讀：想知道讓 AI 看懂網頁的具體工具比較，可以看這篇
                  - link "讓 AI 助理看懂網頁：三大抓取工具完整比較" [ref=e299] [cursor=pointer]:
                    - /url: https://raymondhouch.com/lifehacker/digital-workflow/ai-agent-web-scraping-tools-comparison/
                  - text: 。
              - separator [ref=e300]: ...
              - heading "一個簡單的決策流程" [level=2] [ref=e301]
              - paragraph [ref=e302]: 下次你想讓 AI 幫你自動化某件事，可以照這個順序想：
              - code [ref=e304]: 1. 這個服務有 API（應用程式介面）嗎？ → 有：直接用 API（最快最穩） 2. 有人做好 MCP（模型上下文協議）了嗎？ → 有：裝 MCP，讓 AI 直接用（方便） 3. 有 CLI（命令列工具）嗎？ → 有：讓 AI 下指令（快又穩） 4. 以上都沒有？ → Browser Use / agent-browser（最後手段）
              - paragraph [ref=e305]: 大部分主流服務（Notion、Google、WordPress、GitHub、Slack）都有 API，所以你幾乎不需要走到第 4 步。
              - separator [ref=e306]: ...
              - heading "學會之後，你能組合出什麼？看看我的 19 個工具生態系" [level=2] [ref=e307]
              - paragraph [ref=e308]:
                - text: 講了這麼多原理，你可能會想：「那
                - strong [ref=e309]: 實際上
                - text: 能組合出什麼？」
              - paragraph [ref=e310]:
                - text: 以下是我自己的 AI 分身助理「雷小蒙」目前實際串接的
                - strong [ref=e311]: 19 個工具生態系
                - text: 。背後全部靠這篇講的
                - strong [ref=e312]: API / CLI / MCP
                - text: 三條主力路線組合完成，只有少數沒有 API 的地方才會走 Browser Use。
              - figure [ref=e313]:
                - link "雷蒙三十的 AI Agent「雷小蒙」串接的 19 個工具生態系，包含內容管理、社群、通訊、創作、部署、其他整合六大類" [ref=e314] [cursor=pointer]:
                  - /url: https://raymondhouch.com/wp-content/uploads/2026/04/claude-agent-tool-ecosystem-scaled.jpg
                  - img "雷蒙三十的 AI Agent「雷小蒙」串接的 19 個工具生態系，包含內容管理、社群、通訊、創作、部署、其他整合六大類" [ref=e315]
              - paragraph [ref=e316]: 雷小蒙目前實際串接的 19 個工具：內容管理（WordPress / Ghost / Kit）、社群（Facebook 廣告 / Threads）、通訊（Discord / Gmail / Google Calendar / iMessage）、創作（Obsidian / Eagle）、部署與自動化（Zeabur / n8n / Cloudflare），加上 Testimonial、Figma、Home Assistant、NAS 等其他整合。
              - paragraph [ref=e317]: 所以現在我的 Claude Code 能夠直接對上面列出來的這些應用，直接幫我代理執行操作；不管是拿資料、輸入資料、編輯還是發布等等。
