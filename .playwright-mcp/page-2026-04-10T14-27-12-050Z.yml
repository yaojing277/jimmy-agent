              - paragraph [ref=e324]: 如果你不是工程師，記住這幾件事就夠了：
              - list [ref=e325]:
                - listitem [ref=e326]:
                  - strong [ref=e327]: AI 操控軟體的最佳方式是 API（應用程式介面）和 CLI（命令列介面）
                  - text: ，不用模擬人類去點按鈕
                - listitem [ref=e328]:
                  - strong [ref=e329]: MCP（Model Context Protocol，模型上下文協議）是幫你把 API 包裝好的工具包
                  - text: ，讓 AI 可以直接用，不用自己寫程式
                - listitem [ref=e330]:
                  - strong [ref=e331]: Browser Use（瀏覽器自動化）是最後手段
                  - text: ，不是預設方案，速度慢、容易壞、而且貴（消耗大量 token）
                - listitem [ref=e332]:
                  - strong [ref=e333]: 選對路線的差距是秒和分鐘的差距
                  - text: ，長期累積下來影響巨大
              - paragraph [ref=e334]: 讓 AI 用它擅長的方式工作（API、CLI），而不是逼它模仿人類的方式工作（點按鈕）。這是 AI 時代最重要的自動化觀念。
