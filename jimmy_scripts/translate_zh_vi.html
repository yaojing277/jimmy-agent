<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1420">
<title>中越翻譯</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2232;
    --card-2: #202a3e;
    --border: #2c3850;
    --text: #e8ecf4;
    --text-dim: #8a94a8;
    --accent: #4d9fff;
    --accent-2: #34c78a;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: max(12px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 2px 14px;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  header .engine {
    font-size: 11px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }
  .dir-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .dir-bar button {
    flex: 1; padding: 10px 0; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text-dim); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .dir-bar button.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px; margin-bottom: 12px;
  }
  .panel-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--text-dim); margin-bottom: 8px;
  }
  textarea {
    width: 100%; min-height: 110px; resize: vertical;
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 19px; line-height: 1.55;
    font-family: inherit;
  }
  #output {
    min-height: 110px; font-size: 21px; line-height: 1.6; white-space: pre-wrap;
    word-break: break-word;
  }
  #output.placeholder { color: var(--text-dim); font-size: 17px; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row button {
    flex: 1; padding: 12px 0; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-translate { background: var(--accent); }
  .btn-clear { background: var(--card-2); color: var(--text-dim) !important; border: 1px solid var(--border) !important; }
  .out-actions { display: flex; gap: 8px; margin-top: 12px; }
  .out-actions button {
    flex: 1; padding: 11px 0; border-radius: 12px;
    background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .out-actions button:active { background: var(--border); }
  #status { font-size: 13px; min-height: 18px; margin: 2px 4px 10px; color: var(--text-dim); }
  #status.err { color: var(--danger); }
  #status.ok { color: var(--accent-2); }
  .history-title {
    font-size: 14px; color: var(--text-dim); margin: 18px 4px 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .history-title button {
    background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer;
    text-decoration: underline;
  }
  .history-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .history-item .h-src { font-size: 14px; color: var(--text-dim); margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .h-dst { font-size: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spin {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: sp .7s linear infinite; vertical-align: -2px;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🇹🇼 中越翻譯 🇻🇳</h1>
  <span class="engine" id="engineBadge">Google</span>
</header>

<div class="dir-bar">
  <button id="dirAuto" class="active">自動偵測</button>
  <button id="dirZhVi">中 → 越</button>
  <button id="dirViZh">越 → 中</button>
</div>

<div class="panel">
  <div class="panel-label"><span id="srcLabel">輸入文字（中文或越南文）</span><span id="srcCount"></span></div>
  <textarea id="input" placeholder="請輸入要翻譯的文字…&#10;Nhập văn bản cần dịch…" autocomplete="off"></textarea>
  <div class="btn-row">
    <button class="btn-translate" id="btnTranslate">翻譯 Dịch</button>
    <button class="btn-clear" id="btnClear">清除</button>
  </div>
</div>

<div id="status"></div>

<div class="panel">
  <div class="panel-label"><span id="dstLabel">譯文</span><span id="detected"></span></div>
  <div id="output" class="placeholder">譯文會顯示在這裡 / Bản dịch sẽ hiển thị ở đây</div>
  <div class="out-actions">
    <button id="btnSpeak">🔊 朗讀</button>
    <button id="btnCopy">📋 複製</button>
    <button id="btnSwap">⇄ 對調</button>
  </div>
</div>

<div class="history-title">
  <span>最近翻譯</span>
  <button id="btnClearHistory">清空</button>
</div>
<div id="history"></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const input = $('input'), output = $('output'), status = $('status');
  const HISTORY_KEY = 'zhvi_history';
  const MAX_HISTORY = 20;

  // dir: 'auto' | 'zh-vi' | 'vi-zh'
  let dir = 'auto';
  let lastResult = null;   // { src, dst, srcLang, dstLang }
  let debounceTimer = null;
  let reqSeq = 0;

  // ---------- 方向判斷 ----------
  const hasCJK = s => /[一-鿿㐀-䶿]/.test(s);

  function resolveDirection(text) {
    if (dir === 'zh-vi') return { sl: 'zh-TW', tl: 'vi' };
    if (dir === 'vi-zh') return { sl: 'vi', tl: 'zh-TW' };
    // 自動：含中文字 → 中譯越（直接指定 zh-TW，gtx 的自動偵測對中文短句不可靠）；
    // 否則（越南文/其他拉丁文字）→ 譯成繁中
    return hasCJK(text) ? { sl: 'zh-TW', tl: 'vi' } : { sl: 'auto', tl: 'zh-TW' };
  }

  // ---------- 翻譯引擎 ----------
  async function translateGoogle(text, sl, tl) {
    const base = 'https://translate.googleapis.com/translate_a/single';
    const params = `client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    let resp;
    if (text.length <= 1500) {
      resp = await fetch(`${base}?${params}`);
    } else {
      resp = await fetch(`${base}?client=gtx&sl=${sl}&tl=${tl}&dt=t`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'q=' + encodeURIComponent(text)
      });
    }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const translated = (data[0] || []).map(seg => seg[0]).join('');
    if (!translated) throw new Error('空回應');
    return { translated, detected: data[2] || sl, engine: 'Google' };
  }

  async function translateMyMemory(text, sl, tl) {
    const pair = `${sl === 'auto' ? (hasCJK(text) ? 'zh-TW' : 'vi') : sl}|${tl}`;
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(pair)}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const translated = data.responseData && data.responseData.translatedText;
    if (!translated || data.responseStatus !== 200) throw new Error(data.responseDetails || '翻譯失敗');
    return { translated, detected: pair.split('|')[0], engine: 'MyMemory' };
  }

  async function doTranslate() {
    const text = input.value.trim();
    if (!text) return;
    const { sl, tl } = resolveDirection(text);
    const seq = ++reqSeq;
    setStatus('<span class="spin"></span> 翻譯中…', '');

    let result;
    try {
      result = await translateGoogle(text, sl, tl);
    } catch (e1) {
      try {
        result = await translateMyMemory(text, sl, tl);
      } catch (e2) {
        if (seq !== reqSeq) return;
        setStatus('翻譯失敗，請檢查網路後重試（' + e1.message + '）', 'err');
        return;
      }
    }
    if (seq !== reqSeq) return; // 已有更新的請求，丟棄舊結果

    output.textContent = result.translated;
    output.classList.remove('placeholder');
    $('engineBadge').textContent = result.engine;
    const srcLang = /^zh/.test(result.detected) ? 'zh-TW' : result.detected;
    $('detected').textContent = dir === 'auto' ? '偵測：' + langName(srcLang) : '';
    setStatus('完成 ✓ ' + langName(srcLang) + ' → ' + langName(tl), 'ok');

    lastResult = { src: text, dst: result.translated, srcLang, dstLang: tl };
    saveHistory(lastResult);
  }

  function langName(code) {
    if (/^zh/.test(code)) return '中文';
    if (code === 'vi') return '越南文';
    if (code === 'en') return '英文';
    return code;
  }

  function setStatus(html, cls) {
    status.innerHTML = html;
    status.className = cls;
  }

  // ---------- 朗讀（iOS Safari：需手勢觸發、語音非同步載入） ----------
  let voices = [];
  function loadVoices() { voices = speechSynthesis.getVoices() || []; }
  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak() {
    if (!lastResult) return;
    if (!('speechSynthesis' in window)) { setStatus('此瀏覽器不支援語音朗讀', 'err'); return; }
    speechSynthesis.cancel();
    const lang = lastResult.dstLang === 'vi' ? 'vi-VN' : 'zh-TW';
    const u = new SpeechSynthesisUtterance(lastResult.dst);
    u.lang = lang;
    const v = voices.find(v => v.lang.replace('_', '-').startsWith(lang)) ||
              voices.find(v => v.lang.startsWith(lang.split('-')[0]));
    if (v) u.voice = v;
    else if (lang === 'vi-VN') setStatus('找不到越南語語音，請到 設定→輔助使用→語音內容 下載', 'err');
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }

  // ---------- 複製 / 對調 ----------
  async function copyOutput() {
    if (!lastResult) return;
    try {
      await navigator.clipboard.writeText(lastResult.dst);
      setStatus('已複製 ✓', 'ok');
    } catch (e) {
      // 舊瀏覽器 fallback
      const ta = document.createElement('textarea');
      ta.value = lastResult.dst;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      setStatus('已複製 ✓', 'ok');
    }
  }

  function swap() {
    if (!lastResult) return;
    input.value = lastResult.dst;
    if (dir !== 'auto') setDir(dir === 'zh-vi' ? 'vi-zh' : 'zh-vi');
    doTranslate();
  }

  // ---------- 歷史 ----------
  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch (e) { return []; }
  }

  function saveHistory(item) {
    let list = getHistory().filter(h => h.src !== item.src);
    list.unshift({ src: item.src, dst: item.dst, dstLang: item.dstLang });
    list = list.slice(0, MAX_HISTORY);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    renderHistory();
  }

  function renderHistory() {
    const list = getHistory();
    const box = $('history');
    box.innerHTML = '';
    list.forEach(h => {
      const div = document.createElement('div');
      div.className = 'history-item';
      const src = document.createElement('div');
      src.className = 'h-src';
      src.textContent = h.src;
      const dst = document.createElement('div');
      dst.className = 'h-dst';
      dst.textContent = h.dst;
      div.appendChild(src);
      div.appendChild(dst);
      div.onclick = () => {
        input.value = h.src;
        output.textContent = h.dst;
        output.classList.remove('placeholder');
        lastResult = { src: h.src, dst: h.dst, dstLang: h.dstLang || (hasCJK(h.dst) ? 'zh-TW' : 'vi') };
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      box.appendChild(div);
    });
  }

  // ---------- 方向切換 ----------
  function setDir(d) {
    dir = d;
    $('dirAuto').classList.toggle('active', d === 'auto');
    $('dirZhVi').classList.toggle('active', d === 'zh-vi');
    $('dirViZh').classList.toggle('active', d === 'vi-zh');
    $('detected').textContent = '';
    if (input.value.trim()) doTranslate();
  }

  // ---------- 事件 ----------
  $('dirAuto').onclick = () => setDir('auto');
  $('dirZhVi').onclick = () => setDir('zh-vi');
  $('dirViZh').onclick = () => setDir('vi-zh');
  $('btnTranslate').onclick = doTranslate;
  $('btnSpeak').onclick = speak;
  $('btnCopy').onclick = copyOutput;
  $('btnSwap').onclick = swap;
  $('btnClear').onclick = () => {
    input.value = '';
    output.textContent = '譯文會顯示在這裡 / Bản dịch sẽ hiển thị ở đây';
    output.classList.add('placeholder');
    lastResult = null;
    setStatus('', '');
    $('srcCount').textContent = '';
    $('detected').textContent = '';
    input.focus();
  };
  $('btnClearHistory').onclick = () => {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  };

  input.addEventListener('input', () => {
    $('srcCount').textContent = input.value.length ? input.value.length + ' 字' : '';
    clearTimeout(debounceTimer);
    if (!input.value.trim()) return;
    debounceTimer = setTimeout(doTranslate, 600);
  });

  renderHistory();
})();
</script>
</body>
</html>
