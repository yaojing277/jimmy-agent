<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跌幅分布查詢</title>
<meta name="description" content="輸入台股代號，即時計算每日跌幅區間分布、最大單日漲跌幅與期間報酬">
<style>
:root{--navy:#1b3a6b;--red:#d62828;--green:#2a9d4b;--bg:#f4f7fb;--line:#c5cfdd}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--navy);padding:12px 12px 40px}

/* ── 查詢列（手機原生尺寸，不縮放） ── */
.q{max-width:1080px;margin:0 auto 12px}
.q .row{display:flex;gap:8px}
.q input,.q select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--navy);min-width:0}
.q #code{flex:1;font-weight:700;text-transform:uppercase}
.q button{padding:10px 20px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700}
.q .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.q .chips button{padding:4px 11px;border-radius:14px;background:#e3e9f3;color:var(--navy);font-size:14px;font-weight:600}
.q details{margin-top:8px;font-size:14px}
.q summary{cursor:pointer;color:#556}
.q .opts{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:8px}
.q .opts label{white-space:nowrap}
.msg{max-width:1080px;margin:40px auto;font-size:17px;color:#556;text-align:center;line-height:1.7}
.msg.err{color:var(--red)}

/* ── 圖卡：以 1080px 設計，依螢幕寬度等比縮放（像一張圖） ── */
.stage{margin:0 auto;overflow:hidden}
.card{width:1080px;transform-origin:0 0;background:#fff;border-radius:24px;padding:36px;box-shadow:0 8px 30px #0002}
h1{font-size:64px;font-weight:900;line-height:1.15} h1 b{color:var(--red)} h1 small{font-size:30px;color:#556;margin-left:10px}
.banner{margin:18px 0;background:#fff4c2;border-radius:40px;text-align:center;font-size:34px;font-weight:800;padding:12px}
.period{background:#f3c6cc;color:#7a1d2a;border-radius:12px;text-align:center;font-size:28px;font-weight:800;padding:10px}
.kpis{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;margin:18px 0}
.kpi{border:2px solid #dde4ee;border-radius:16px;padding:16px;text-align:center}
.kpi .t{font-size:24px;font-weight:800} .kpi .v{font-size:64px;font-weight:900;color:var(--red)}
.kpi .v.neg{color:var(--green)} .kpi .sub{font-size:22px;font-weight:700}
.ud{display:flex;flex-direction:column;gap:12px}
.ud div{border-radius:14px;padding:10px 14px;font-weight:800;font-size:22px}
.ud .up{background:#fdecec;color:var(--red);border:2px solid var(--red)}
.ud .dn{background:#e9f7ee;color:var(--green);border:2px solid var(--green)}
.ud span{font-size:42px;font-weight:900;display:block}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{background:var(--navy);color:#fff;font-size:26px;padding:12px}
td{padding:14px;font-size:24px;font-weight:700}
.lab{font-size:26px;font-weight:900;border-radius:12px 0 0 12px;white-space:nowrap;width:230px}
.num{font-size:48px;font-weight:900;text-align:center;white-space:nowrap;width:150px} .num small{font-size:22px}
.pct{font-size:44px;font-weight:900;color:var(--red);text-align:center}
.note{border-radius:0 12px 12px 0}
tr.green td{background:#eaf6ea} tr.blue td{background:#e8f0fb}
tr.amber td{background:#fdf1dc} tr.orange td{background:#fde4d4} tr.red td{background:#fbe6ea}
.foot{text-align:center;font-size:18px;margin-top:14px;color:#556}
.loading .stage{opacity:.35}
</style>
</head>
<body>

<form class="q" id="f" autocomplete="off">
  <div class="row">
    <input id="code" list="codes" placeholder="股票代號或名稱，如 00878" inputmode="text" enterkeyhint="search">
    <button>計算</button>
  </div>
  <datalist id="codes"></datalist>
  <div class="chips" id="chips"></div>
  <details>
    <summary>進階設定</summary>
    <div class="opts">
      <label>起日</label><input type="date" id="start">
      <label>迄日</label><input type="date" id="end">
      <label>對照</label><input id="compare" value="0050" placeholder="空白＝不比較">
      <label>區間</label><input id="edges" placeholder="空白＝自動（正二 1,2,4,7）">
      <label>除息</label><label><input type="checkbox" id="raw"> 不調整除息（純收盤價相減）</label>
    </div>
  </details>
</form>

<div id="out"><div class="msg">載入資料中…</div></div>

<script>
const QUICK = ["00878","00631L","00663L","00675L","00685L","0050","0056","00919","2330"];
const COLORS = ["green","blue","amber","orange","red"];
const HINTS = ["日常最常見的微幅震盪整理","大盤回檔時的溫和拉回","較明顯的修正","大幅修正","極端急跌"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = iso => `${+iso.slice(5,7)}/${+iso.slice(8,10)}`;
const mmdd = iso => iso.slice(5).replace("-","/");

let META = null, NAMES = {};
const MONTHS = {};                                   // "2026-08" → 月檔

async function getMonth(ym) {
  if (!(ym in MONTHS)) {
    MONTHS[ym] = fetch(`data/${ym}.json?v=${encodeURIComponent(META.updated)}`)
      .then(r => r.ok ? r.json() : null).catch(() => null);
  }
  return MONTHS[ym];
}

/** 取 [start 前一個月, end] 涵蓋的月檔，串成單一代號的時間序列 */
async function series(code, start, end) {
  const want = META.months.filter(m => m >= prevYM(start.slice(0,7)) && m <= end.slice(0,7));
  const docs = (await Promise.all(want.map(getMonth))).filter(Boolean);
  const out = {dates: [], c: [], p: [], name: null};
  for (const doc of docs) {
    if (!doc.c[code]) continue;
    out.name = doc.n[code] || out.name;
    out.dates.push(...doc.dates); out.c.push(...doc.c[code]); out.p.push(...doc.p[code]);
  }
  return out;
}
function prevYM(ym) { let [y, m] = ym.split("-").map(Number); m--; if (!m) { y--; m = 12; } return `${y}-${String(m).padStart(2,"0")}`; }

async function analyze(code, start, end, raw, edges) {
  const s = await series(code, start, end);
  if (!s.dates.length) throw new Error(`查無 ${code} 的資料（目前只收錄上市股票與 ETF）`);
  const rows = []; let prev = null, base = null, cum = 1;
  for (let i = 0; i < s.dates.length; i++) {
    const d = s.dates[i], close = s.c[i];
    if (close == null) continue;
    if (d < start) { prev = close; continue; }
    if (d > end) break;
    if (base == null) base = prev ?? close;
    const v = raw ? (prev ? Math.round((close - prev) / prev * 10000) / 100 : null) : s.p[i];
    prev = close;
    if (v == null) continue;
    rows.push({d, close, pct: v});
    cum *= 1 + v / 100;
  }
  if (!rows.length) throw new Error(`${code} 在 ${start} ~ ${end} 沒有交易資料`);
  const last = rows[rows.length - 1];
  const downs = rows.filter(r => r.pct < 0);
  const st = {
    code, name: s.name, start, end: end < last.d ? end : last.d, raw,
    trading: rows.length, up: rows.filter(r => r.pct > 0).length,
    flat: rows.filter(r => r.pct === 0).length, down: downs.length,
    last, maxUp: rows.reduce((a, b) => b.pct > a.pct ? b : a),
    maxDown: rows.reduce((a, b) => b.pct < a.pct ? b : a),
    // 調整模式：逐日官方漲跌幅連乘＝含息報酬（除息已還原）；不調整模式：純價差
    ret: raw ? (last.close - base) / base * 100 : (cum - 1) * 100,
    buckets: [],
  };
  const bounds = [0, ...edges, 999], n = bounds.length - 1;
  for (let i = 0; i < n; i++) {
    const lo = bounds[i], hi = bounds[i + 1];
    const label = i === 0 ? `跌幅不到 ${hi}%` : i === n - 1 ? `跌幅 ${lo}% 以上` : `跌幅 ${lo}%~${hi}%`;
    const k = i === 0 ? 0 : i === n - 1 ? COLORS.length - 1 : Math.min(i, COLORS.length - 2);
    const hit = downs.filter(r => Math.abs(r.pct) >= lo && Math.abs(r.pct) < hi);
    st.buckets.push({label, color: COLORS[k], days: hit.length,
                     ratio: downs.length ? hit.length / downs.length * 100 : 0,
                     note: note(HINTS[k], hit)});
  }
  return st;
}

function note(hint, hit) {
  if (!hit.length) return "期間內未出現";
  if (hit.length <= 3) return `${hint}（僅 ${hit.map(r => mmdd(r.d)).join("、")} 出現 ${hit.length} 次）`;
  const cnt = new Map();                               // 插入順序＝首次出現順序，同數時保持（同 Python Counter）
  hit.forEach(r => { const m = +r.d.slice(5, 7); cnt.set(m, (cnt.get(m) || 0) + 1); });
  const top = [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([m]) => `${m} 月`);
  return `${hint}，集中於 ${top.join("、")}`;
}

function render(s, cmp) {
  const f2 = v => v.toFixed(2), sg = v => (v > 0 ? "+" : "") + f2(v);
  const verdict = cmp ? `${s.start.slice(0,4)} 期間績效${s.ret > cmp.ret ? "打敗" : "落後"} ${esc(cmp.code)}` : "每日跌幅分布統計";
  const rows = s.buckets.map(b => `<tr class="${b.color}"><td class="lab">${esc(b.label)}</td>
    <td class="num">${b.days}<small> 天</small></td><td class="pct">${b.ratio.toFixed(1)}%</td>
    <td class="note">${esc(b.note)}</td></tr>`).join("");
  return `<div class="card">
<h1>${esc(s.code)} 當日跌到<b>多少%</b><small>${esc(s.name || "")}</small><br>你會選擇進場？</h1>
<div class="banner">${verdict}</div>
<div class="period">${md(s.start)}~${md(s.end)} 每日跌幅統計　總交易日 ${s.trading} 天（下跌 ${s.down} 天）</div>
<div class="kpis">
 <div class="kpi"><div class="t">${md(s.last.d)} 股價</div><div class="v">${f2(s.last.close)}</div></div>
 <div class="kpi"><div class="t">期間${s.raw ? "漲幅" : "報酬（含息）"}</div>
   <div class="v${s.ret < 0 ? " neg" : ""}">${f2(s.ret)}%</div>
   ${cmp ? `<div class="sub">（${esc(cmp.code)} 為 ${f2(cmp.ret)}%）</div>` : ""}</div>
 <div class="ud">
  <div class="up">最大單日漲幅<span>${sg(s.maxUp.pct)}%</span>(${mmdd(s.maxUp.d)})</div>
  <div class="dn">最大單日跌幅<span>${sg(s.maxDown.pct)}%</span>(${mmdd(s.maxDown.d)})</div>
 </div>
</div>
<table><tr><th>跌幅區間</th><th>天數</th><th>占總下跌天數比例</th><th>說明與走勢觀察</th></tr>${rows}</table>
<div class="foot">資料來源：證交所收盤行情／除權息參考價（${s.raw ? "未調整除息" : "官方漲跌幅，已還原除息與分割"}）　資料更新 ${esc(META.updated)}</div>
</div>`;
}

function fit() {                                       // 1080px 圖卡依螢幕等比縮放
  const card = document.querySelector(".card"), stage = document.querySelector(".stage");
  if (!card) return;
  const k = Math.min(1, (document.documentElement.clientWidth - 24) / 1080);
  card.style.transform = `scale(${k})`;
  stage.style.width = `${1080 * k}px`;
  stage.style.height = `${card.offsetHeight * k}px`;
}
addEventListener("resize", fit);

function resolveCode(v) {                              // 允許輸入名稱（完全相符或唯一包含）
  v = v.trim(); const u = v.toUpperCase();
  if (NAMES[u]) return u;
  const hits = Object.keys(NAMES).filter(c => NAMES[c] === v || NAMES[c].includes(v));
  return hits.length === 1 ? hits[0] : (hits.find(c => NAMES[c] === v) || u.split(/\s/)[0]);
}

async function run() {
  const code = resolveCode($("code").value);
  if (!code) return;
  $("code").value = code;
  const start = $("start").value, end = $("end").value;
  const compare = $("compare").value.trim().toUpperCase();
  const raw = $("raw").checked;
  const es = $("edges").value.trim() || (code.endsWith("L") ? "1,2,4,7" : "1,2,4");
  const edges = es.split(",").map(Number).filter(x => x > 0).sort((a, b) => a - b);
  const qs = new URLSearchParams({code});
  if (start !== `${META.last_date.slice(0,4)}-01-01`) qs.set("start", start);
  if (end !== META.last_date) qs.set("end", end);
  if (compare !== "0050") qs.set("compare", compare);
  if ($("edges").value.trim()) qs.set("edges", es);
  if (raw) qs.set("raw", "1");
  history.replaceState(null, "", "?" + qs);
  document.body.classList.add("loading");
  if (!document.querySelector(".card")) $("out").innerHTML = `<div class="msg">計算中…（第一次約需下載 1 MB 資料，之後會快取）</div>`;
  try {
    const s = await analyze(code, start, end, raw, edges);
    let cmp = null;
    if (compare && compare !== code) {
      try { cmp = await analyze(compare, start, end, raw, edges); } catch (e) { cmp = null; }
    }
    $("out").innerHTML = `<div class="stage">${render(s, cmp)}</div>`;
    document.title = `${code} 跌幅分布`;
    fit();
  } catch (e) {
    $("out").innerHTML = `<div class="msg err">⚠️ ${esc(e.message)}</div>`;
  } finally {
    document.body.classList.remove("loading");
  }
}

$("f").addEventListener("submit", e => { e.preventDefault(); $("code").blur(); run(); });
$("chips").innerHTML = QUICK.map(c => `<button type="button">${c}</button>`).join("");
$("chips").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") { $("code").value = e.target.textContent; run(); }
});

(async function init() {
  try {
    META = await fetch("data/meta.json", {cache: "no-store"}).then(r => r.json());
  } catch (e) {
    $("out").innerHTML = `<div class="msg err">⚠️ 資料索引載入失敗，請稍後再試</div>`;
    return;
  }
  const p = new URLSearchParams(location.search);
  $("start").value = p.get("start") || `${META.last_date.slice(0,4)}-01-01`;
  $("end").value = p.get("end") || META.last_date;
  if (p.has("compare")) $("compare").value = p.get("compare");
  if (p.has("edges")) $("edges").value = p.get("edges");
  $("raw").checked = p.get("raw") === "1";
  // 代號清單（自動完成）取最新月檔
  const latest = await getMonth(META.months[META.months.length - 1]);
  NAMES = latest ? latest.n : {};
  $("codes").innerHTML = Object.entries(NAMES).map(([c, n]) => `<option value="${esc(c)}">${esc(n)}</option>`).join("");
  if (p.get("code")) { $("code").value = p.get("code"); run(); }
  else $("out").innerHTML = `<div class="msg">輸入代號後按「計算」，或點上方常用代號。<br>資料到 ${META.last_date}（每個交易日 14:30 後更新）</div>`;
})();
</script>
</body>
</html>
