<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股價試算 Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: '微軟正黑體', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      padding: 32px 20px;
      color: white;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 3px;
      color: #ffd700;
    }
    .subtitle {
      text-align: center;
      font-size: .85rem;
      color: #888;
      margin-bottom: 32px;
    }
    .sheet-badge {
      display: inline-block;
      background: rgba(255,215,0,.15);
      border: 1px solid rgba(255,215,0,.35);
      border-radius: 6px;
      padding: 2px 10px;
      font-size: .82rem;
      color: #ffd700;
      margin-left: 8px;
    }

    /* ── 登入按鈕 ── */
    #login-section {
      text-align: center;
      margin-top: 60px;
    }
    .btn-google {
      background: white;
      color: #3c4043;
      border: none;
      padding: 13px 28px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-google:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.5); }

    /* ── 載入中 ── */
    #loading-section {
      display: none;
      text-align: center;
      margin-top: 80px;
      color: #aaa;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,.1);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 主畫面 ── */
    #main-section { display: none; max-width: 600px; margin: 0 auto; }

    /* ── 數值卡片 ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      padding: 22px 16px;
      text-align: center;
      transition: transform .2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card.highlight {
      border-color: rgba(255,215,0,.4);
      background: rgba(255,215,0,.07);
    }
    .card-label {
      font-size: .78rem;
      color: #888;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .card-cell {
      font-size: .7rem;
      color: #555;
      margin-bottom: 6px;
      font-family: monospace;
    }
    .card-value {
      font-size: 2rem;
      font-weight: bold;
      color: #ffd700;
      line-height: 1;
    }
    .card-unit {
      font-size: .82rem;
      color: #888;
      margin-top: 6px;
    }

    /* ── 衍生計算 ── */
    .calc-box {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .calc-box h3 {
      font-size: .88rem;
      color: #aaa;
      margin-bottom: 14px;
      letter-spacing: 2px;
    }
    .calc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      font-size: .92rem;
    }
    .calc-row:last-child { border-bottom: none; }
    .calc-label { color: #aaa; }
    .calc-val { font-weight: bold; }
    .calc-val.green { color: #4ade80; }
    .calc-val.red   { color: #f87171; }
    .calc-val.gold  { color: #ffd700; }

    /* ── 時間戳 ── */
    .timestamp {
      text-align: center;
      font-size: .78rem;
      color: #444;
      margin-top: 16px;
    }

    /* ── 錯誤 ── */
    .error-box {
      background: rgba(248,113,113,.1);
      border: 1px solid rgba(248,113,113,.3);
      border-radius: 10px;
      padding: 14px 18px;
      color: #f87171;
      text-align: center;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .cards { grid-template-columns: 1fr; }
      .card-value { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <h1>📊 股價試算 Dashboard</h1>
  <p class="subtitle">自動讀取最新 Jimmy_ 工作表的 B2、C2、J2</p>

  <!-- 登入 -->
  <div id="login-section">
    <button class="btn-google" id="login-btn">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      使用 Google 帳號登入
    </button>
    <div class="error-box" id="login-error" style="display:none;max-width:360px;margin:16px auto 0"></div>
  </div>

  <!-- 載入中 -->
  <div id="loading-section">
    <div class="spinner"></div>
    <div id="loading-msg">讀取中…</div>
  </div>

  <!-- 主畫面 -->
  <div id="main-section">
    <div class="cards">
      <div class="card">
        <div class="card-cell">B2</div>
        <div class="card-label">買進價</div>
        <div class="card-value" id="val-b2">—</div>
        <div class="card-unit">元</div>
      </div>
      <div class="card">
        <div class="card-cell">C2</div>
        <div class="card-label">持有股數</div>
        <div class="card-value" id="val-c2">—</div>
        <div class="card-unit">股</div>
      </div>
      <div class="card highlight">
        <div class="card-cell">J2</div>
        <div class="card-label">最新收盤價</div>
        <div class="card-value" id="val-j2">—</div>
        <div class="card-unit">元</div>
      </div>
    </div>

    <div class="calc-box">
      <h3>◈ 試算結果</h3>
      <div class="calc-row">
        <span class="calc-label">買進成本</span>
        <span class="calc-val gold" id="calc-cost">—</span>
      </div>
      <div class="calc-row">
        <span class="calc-label">目前市值</span>
        <span class="calc-val gold" id="calc-value">—</span>
      </div>
      <div class="calc-row">
        <span class="calc-label">損益金額</span>
        <span class="calc-val" id="calc-pnl">—</span>
      </div>
      <div class="calc-row">
        <span class="calc-label">損益率</span>
        <span class="calc-val" id="calc-pct">—</span>
      </div>
    </div>

    <div class="timestamp" id="timestamp"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // ★ 填入你的 OAuth Client ID
    const CLIENT_ID = '613914242956-9kddoecdql3nc2vn38q9g8rjas66b4jh.apps.googleusercontent.com';
    const FILE_NAME = '股價試算';

    let accessToken = null;

    document.getElementById('login-btn').onclick = () => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: async (resp) => {
          if (resp.error) return showErr(resp.error);
          accessToken = resp.access_token;
          await run();
        },
      });
      client.requestAccessToken();
    };

    async function run() {
      show('loading');
      setLoading('搜尋「股價試算」檔案…');
      try {
        // 1. 找檔案
        const q = `title='${FILE_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`;
        const res  = await gFetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&pageSize=1&fields=files(id,name)`);
        const data = await res.json();
        if (!data.files?.length) return showErr('找不到「股價試算」檔案');

        const fileId = data.files[0].id;
        setLoading('下載試算表…');

        // 2. 匯出 xlsx
        const xlsx = await gFetch(`https://www.googleapis.com/drive/v3/files/${fileId}/export?mimeType=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`);
        const buf  = await xlsx.arrayBuffer();
        const wb   = XLSX.read(buf, { type: 'array' });

        // 3. 找最新 Jimmy_ 工作表
        const latest = wb.SheetNames
          .filter(n => /^Jimmy_\d{6}$/.test(n))
          .sort((a, b) => b.split('_')[1].localeCompare(a.split('_')[1]))[0];
        if (!latest) return showErr('找不到 Jimmy_YYMMDD 格式工作表');

        // 4. 讀取 B2、C2、J2
        const ws = wb.Sheets[latest];
        const b2 = parseFloat(ws['B2']?.v ?? 0);
        const c2 = parseFloat(ws['C2']?.v ?? 0);
        const j2 = parseFloat(ws['J2']?.v ?? 0);

        // 5. 顯示
        displayResult(latest, b2, c2, j2);
        show('main');
      } catch(e) {
        showErr(e.message);
      }
    }

    function displayResult(sheet, b2, c2, j2) {
      const cost  = b2 * c2;
      const value = j2 * c2;
      const pnl   = value - cost;
      const pct   = cost > 0 ? (pnl / cost * 100) : 0;
      const isPos = pnl >= 0;

      document.querySelector('h1').innerHTML =
        `📊 股價試算 Dashboard <span class="sheet-badge">${sheet}</span>`;

      document.getElementById('val-b2').textContent = b2.toLocaleString();
      document.getElementById('val-c2').textContent = c2.toLocaleString();
      document.getElementById('val-j2').textContent = j2.toLocaleString();

      document.getElementById('calc-cost').textContent  = `NT$ ${fmt(cost)}`;
      document.getElementById('calc-value').textContent = `NT$ ${fmt(value)}`;

      const pnlEl = document.getElementById('calc-pnl');
      pnlEl.textContent = `${isPos ? '+' : ''}NT$ ${fmt(pnl)}`;
      pnlEl.className   = `calc-val ${isPos ? 'green' : 'red'}`;

      const pctEl = document.getElementById('calc-pct');
      pctEl.textContent = `${isPos ? '+' : ''}${pct.toFixed(2)}%`;
      pctEl.className   = `calc-val ${isPos ? 'green' : 'red'}`;

      document.getElementById('timestamp').textContent =
        `最後讀取：${new Date().toLocaleString('zh-TW')}`;
    }

    function fmt(n) {
      return Math.round(n).toLocaleString('zh-TW');
    }
    function gFetch(url) {
      return fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
    }
    function show(section) {
      ['login','loading','main'].forEach(s =>
        document.getElementById(`${s}-section`).style.display = s === section ? 'block' : 'none'
      );
    }
    function setLoading(msg) {
      document.getElementById('loading-msg').textContent = msg;
    }
    function showErr(msg) {
      show('login');
      const el = document.getElementById('login-error');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
