<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>象棋麻將</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Serif TC', '標楷體', serif;
      background: #2d5a1b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: white;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    .game-info {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 10px 20px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1rem;
    }
    .players-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      max-width: 820px;
      margin-bottom: 20px;
    }
    .player-panel {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 15px;
      border: 2px solid transparent;
      transition: border-color 0.3s, background 0.3s;
    }
    .player-panel.active {
      border-color: #ffd700;
      background: rgba(255,215,0,0.08);
    }
    .player-name {
      font-size: 1rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dealer-badge {
      background: #ffd700;
      color: #333;
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: bold;
    }
    .hand { display: flex; flex-wrap: wrap; gap: 8px; }
    .piece {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: bold;
      border: 3px solid;
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
    }
    .piece.red    { background: #cc0000; color: #ffffff; border-color: #8b0000; }
    .piece.black  { background: #3a3a3a; color: #ddd;    border-color: #111; }
    .piece.hidden { background: #5c3d1a; color: #5c3d1a; border-color: #3d2710; cursor: default; }
    .piece.selectable:hover {
      transform: translateY(-6px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .piece.drawn { animation: pop 0.4s ease-out; box-shadow: 0 0 14px #ffd700; }
    @keyframes pop {
      0%   { transform: scale(0.6); opacity: 0.4; }
      70%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .controls {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 15px 25px;
      margin-bottom: 20px;
      text-align: center;
    }
    .btn {
      background: #ffd700;
      color: #333;
      border: none;
      padding: 11px 28px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
      margin: 4px;
    }
    .btn:hover:not(:disabled) { background: #ffe96e; transform: translateY(-2px); }
    .btn:disabled { background: #666; cursor: not-allowed; }
    .btn.secondary { background: #5a8a5a; color: white; }
    .btn.secondary:hover:not(:disabled) { background: #6aaa6a; }
    .status-msg { font-size: 1.05rem; margin-top: 10px; min-height: 1.4rem; color: #ffd700; font-weight: bold; }
    .log {
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 10px 14px;
      max-height: 130px;
      overflow-y: auto;
      width: 100%;
      max-width: 820px;
      font-size: 0.82rem;
      color: #bbb;
    }
    .log p { margin: 2px 0; line-height: 1.4; }
    .win-overlay { display: none; width: 100%; max-width: 820px; margin-bottom: 12px; }
    .win-overlay.show { display: block; }
    .win-box {
      background: #fff8e8;
      color: #333;
      border-radius: 12px;
      padding: 14px 24px;
      text-align: center;
      border: 3px solid #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .win-box h2 { font-size: 1.3rem; color: #cc0000; margin: 0; }
    .win-box p  { font-size: 0.95rem; color: #555; margin: 0; }
    .discard-area {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 820px;
    }
    .discard-area h3 {
      font-size: 0.95rem;
      color: #aaa;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .discard-rows { display: flex; flex-direction: column; gap: 10px; }
    .discard-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .discard-label {
      font-size: 0.78rem;
      color: #888;
      min-width: 52px;
      flex-shrink: 0;
    }
    .piece.small {
      width: 36px;
      height: 36px;
      font-size: 0.85rem;
      border-width: 2px;
    }
    .piece.eatable {
      box-shadow: 0 0 12px #ffd700, 0 0 24px #ffd70088;
      animation: glow 1s ease-in-out infinite alternate;
      cursor: default;
    }
    @keyframes glow {
      from { box-shadow: 0 0 8px #ffd700; }
      to   { box-shadow: 0 0 20px #ffd700, 0 0 36px #ffd70066; }
    }
    .eat-controls { margin-top: 10px; }
    .btn.eat { background: #e05c00; color: white; }
    .btn.eat:hover:not(:disabled) { background: #ff7020; }

    /* ── 座位設定（真人／AI）── */
    .seat-config { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
    .seat-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,215,0,0.25);
      color: #ddd; border-radius: 8px;
      padding: 5px 11px; font-size: .78rem; cursor: pointer;
      font-family: inherit; transition: background .2s, border-color .2s, color .2s;
    }
    .seat-btn:hover { background: rgba(255,255,255,0.12); }
    .seat-btn.ai { border-color: #5577cc; color: #9db8ff; background: rgba(85,119,204,0.14); }
    .seat-btn .seat-role { font-weight: bold; margin-left: 2px; }
    .seat-hint { font-size: .74rem; color: #ffd700; margin-top: 6px; min-height: 1rem; }

    /* ── AI 標記與思考動畫 ── */
    .ai-badge {
      background: linear-gradient(135deg,#5577cc,#334499); color: #fff;
      font-size: .62rem; padding: 2px 7px; border-radius: 10px;
      font-weight: bold; letter-spacing: 1px;
    }
    .thinking { font-size: .72rem; color: #9db8ff; display: inline-flex; align-items: center; gap: 3px; }
    .dot-anim span {
      display: inline-block; width: 4px; height: 4px; border-radius: 50%;
      background: #9db8ff; margin-left: 2px; animation: dot-bounce 1.1s infinite ease-in-out;
    }
    .dot-anim span:nth-child(2) { animation-delay: .18s; }
    .dot-anim span:nth-child(3) { animation-delay: .36s; }
    @keyframes dot-bounce {
      0%, 70%, 100% { opacity: .25; transform: translateY(0); }
      35%           { opacity: 1;   transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <h1>♟ 象棋麻將</h1>

  <div class="game-info">
    <div id="turn-info">點擊「新遊戲」開始</div>
    <div id="deck-count">牌堆：32 張</div>
    <div style="margin-top:10px">
      <button class="btn secondary" onclick="newGame()">新遊戲</button>
      <button class="btn secondary" id="reveal-btn" onclick="toggleReveal()">👁 顯示全部手牌</button>
    </div>
    <div class="seat-config" id="seat-config"></div>
    <div id="seat-summary" style="font-size:.74rem;color:#9db8ff;margin-top:5px"></div>
    <div class="seat-hint" id="seat-hint"></div>
  </div>

  <div class="players-area" id="players-area"></div>

  <div class="controls">
    <button class="btn" id="draw-btn" disabled onclick="drawPiece()">摸牌</button>
    <div class="eat-controls" id="eat-controls" style="display:none">
      <button class="btn eat" onclick="eatPiece()">吃牌</button>
      <button class="btn secondary" onclick="skipEat()">跳過</button>
    </div>
    <div class="status-msg" id="status-msg"></div>
  </div>

  <div class="win-overlay" id="win-overlay">
    <div class="win-box">
      <h2>胡牌！</h2>
      <p id="win-msg"></p>
      <button class="btn" onclick="newGame()">再來一局</button>
    </div>
  </div>

  <div class="discard-area">
    <h3>棄牌區</h3>
    <div class="discard-rows" id="discard-rows"></div>
  </div>

  <div class="log" id="log"></div>

  <script>
    // ── 牌堆 ──────────────────────────────────────────────
    function createDeck() {
      const pieces = [];
      let id = 0;
      const redTypes   = [['帥',1],['仕',2],['相',2],['車',2],['馬',2],['炮',2],['兵',5]];
      const blackTypes = [['將',1],['士',2],['象',2],['車',2],['馬',2],['包',2],['卒',5]];
      for (const [type, n] of redTypes)   for (let i=0;i<n;i++) pieces.push({id:id++,type,color:'red'});
      for (const [type, n] of blackTypes) for (let i=0;i<n;i++) pieces.push({id:id++,type,color:'black'});
      return pieces;
    }

    function shuffle(arr) {
      for (let i=arr.length-1;i>0;i--) {
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
      return arr;
    }

    // ── 胡牌判斷 ──────────────────────────────────────────
    function combos(arr, k) {
      if (k===0) return [[]];
      if (arr.length<k) return [];
      const [h,...t]=arr;
      return [...combos(t,k-1).map(c=>[h,...c]),...combos(t,k)];
    }

    const TYPE_ORDER = { '帥':0,'將':0,'仕':1,'士':1,'相':2,'象':2,'車':3,'馬':4,'炮':5,'包':5,'兵':6,'卒':6 };
    const COLOR_ORDER = { 'red':0, 'black':1 };
    function sortHand(hand) {
      hand.sort((a,b) => COLOR_ORDER[a.color]-COLOR_ORDER[b.color] || (TYPE_ORDER[a.type]??9)-(TYPE_ORDER[b.type]??9));
    }

    function pairKey(type) { return type==='帥' ? '將' : type; }
    function isPair(two) {
      return two.length===2 && pairKey(two[0].type)===pairKey(two[1].type);
    }

    function checkWin(hand) {
      if (hand.length!==5) return {win:false};

      // 三連組（同色）+ 對子（同名不限色）
      const trioByColor = [
        { color:'red',   types:['帥','仕','相'], label:'紅帥+仕+相' },
        { color:'black', types:['將','士','象'], label:'黑將+士+象' },
        { color:'red',   types:['車','馬','炮'], label:'紅車+馬+炮' },
        { color:'black', types:['車','馬','包'], label:'黑車+馬+包' },
      ];
      for (const { color, types, label } of trioByColor) {
        const trio = types.map(t => hand.find(p => p.type===t && p.color===color));
        if (trio.some(p=>!p)) continue;
        const ids  = new Set(trio.map(p=>p.id));
        const rest = hand.filter(p=>!ids.has(p.id));
        if (isPair(rest))
          return {win:true, pattern:`${label} + 對子（${rest[0].type}）`};
      }

      // 卒/兵 組合
      for (const [type, color, label] of [['卒','black','黑卒'],['兵','red','紅兵']]) {
        const pawns = hand.filter(p=>p.type===type && p.color===color);

        if (pawns.length===5)
          return {win:true, pattern:`五${label}`};

        if (pawns.length>=3) {
          for (const trio of combos(pawns,3)) {
            const ids  = new Set(trio.map(p=>p.id));
            const rest = hand.filter(p=>!ids.has(p.id));
            if (isPair(rest))
              return {win:true, pattern:`三${label} + 對子（${rest[0].type}）`};
          }
        }
      }

      return {win:false};
    }

    // ── 座位設定（真人／AI）──────────────────────────────
    const SEAT_KEY = 'chess_mahjong_seats';
    let seatConfig = loadSeatConfig();

    function loadSeatConfig() {
      try {
        const raw = JSON.parse(localStorage.getItem(SEAT_KEY));
        if (Array.isArray(raw) && raw.length === 4 && raw.every(v => v === 'human' || v === 'ai')) return raw;
      } catch (e) { /* 忽略毀損的設定 */ }
      return ['human','human','human','ai'];   // 預設：三真人 + 一 AI
    }

    function saveSeatConfig() {
      try { localStorage.setItem(SEAT_KEY, JSON.stringify(seatConfig)); } catch (e) {}
    }

    function toggleSeat(i) {
      seatConfig[i] = seatConfig[i] === 'ai' ? 'human' : 'ai';
      saveSeatConfig();
      renderSeatConfig();
      document.getElementById('seat-hint').textContent =
        state.phase === 'idle' ? '' : '座位變更將於下一局生效';
    }

    function seatName(i) { return seatConfig[i] === 'ai' ? `AI ${i+1}` : `玩家 ${i+1}`; }

    function renderSeatConfig() {
      const box = document.getElementById('seat-config');
      box.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const isAI = seatConfig[i] === 'ai';
        const b = document.createElement('button');
        b.className = `seat-btn${isAI ? ' ai' : ''}`;
        b.innerHTML = `${isAI ? '🤖' : '👤'} ${i+1}號<span class="seat-role">${isAI ? 'AI' : '真人'}</span>`;
        b.title = '點擊切換「真人／AI」';
        b.onclick = () => toggleSeat(i);
        box.appendChild(b);
      }
      const aiCount = seatConfig.filter(s => s === 'ai').length;
      document.getElementById('seat-summary').textContent =
        `真人 ${4 - aiCount} 位 ／ AI ${aiCount} 位（點座位可切換）`;
    }

    // ── AI 引擎（記牌加強版）──────────────────────────────
    // createDeck() 的 id 配發順序固定，可當作 id ↔ 棋子的對照表
    const FULL_DECK = createDeck();
    const AI_DELAY  = { draw: 650, discard: 950, eat: 800 };

    // 這一局「尚未現形」的牌 = 全牌 −（AI 自己手牌 ＋ 所有棄牌 ＋ 曾被吃走的牌）
    function unseenPool(aiId) {
      const seen = new Set();
      state.players[aiId].hand.forEach(p => seen.add(p.id));
      state.discards.forEach(pile => pile.forEach(p => seen.add(p.id)));
      state.eaten.forEach(p => seen.add(p.id));
      return FULL_DECK.filter(p => !seen.has(p.id));
    }

    // 保留這 4 張時，下一張隨機摸牌就能胡的機率（已打光的牌型權重自然歸零 ＝ 記牌）
    function winProb(hand4, unseen) {
      if (hand4.length !== 4 || unseen.length === 0) return 0;
      const cache = new Map();
      let hits = 0;
      for (const cand of unseen) {
        const key = cand.color + cand.type;
        let ok = cache.get(key);
        if (ok === undefined) { ok = checkWin([...hand4, cand]).win; cache.set(key, ok); }
        if (ok) hits++;
      }
      return hits / unseen.length;
    }

    // 打出這張牌的危險度：同型還沒現形的張數越多，對手手上有、靠它成牌的機會越大
    function discardRisk(piece, unseen) {
      if (unseen.length === 0) return 0;
      const same = unseen.filter(p => p.type === piece.type && p.color === piece.color).length;
      return same / unseen.length;
    }

    // 防守權重：牌堆見底、或別家吃過牌（代表有人在做牌）時提高戒心
    function defenseWeight(aiId) {
      let w = 0.12;
      if (state.deck.length <= 8) w += 0.18;
      if (state.deck.length <= 4) w += 0.20;
      const othersEat = state.eatCount.reduce((s, c, i) => i === aiId ? s : s + c, 0);
      return w + Math.min(othersEat, 4) * 0.06;
    }

    function aiChooseDiscard(hand5, aiId) {
      const unseen = unseenPool(aiId);
      const dw     = defenseWeight(aiId);
      let best = hand5[0], bestScore = -Infinity;
      for (const piece of hand5) {
        const rest  = hand5.filter(p => p.id !== piece.id);
        const score = winProb(rest, unseen) - dw * discardRisk(piece, unseen);
        if (score > bestScore) { bestScore = score; best = piece; }
      }
      return best;
    }

    function aiShouldEat(hand4, piece, aiId) {
      if (checkWin([...hand4, piece]).win) return true;
      const unseen = unseenPool(aiId);
      const after  = [...hand4, piece];
      let bestAfter = 0;
      for (const p of after) {
        bestAfter = Math.max(bestAfter, winProb(after.filter(x => x.id !== p.id), unseen));
      }
      return bestAfter > winProb(hand4, unseen) + 0.01;   // 確實變強才吃，否則跳過自己摸
    }

    // ── AI 自動出手 ──────────────────────────────────────
    let aiTimer = null;

    function cancelAITurn() { if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } }

    function scheduleAITurn() {
      if (aiTimer) return;
      const p = state.players[state.currentPlayer];
      if (!p || !p.isAI) return;
      if (!['draw','discard','can-eat'].includes(state.phase)) return;
      const delay = state.phase === 'draw'    ? AI_DELAY.draw
                  : state.phase === 'discard' ? AI_DELAY.discard
                  :                             AI_DELAY.eat;
      aiTimer = setTimeout(() => {
        aiTimer = null;
        const cur = state.players[state.currentPlayer];
        if (!cur || !cur.isAI) return;
        if (state.phase === 'draw') {
          drawPiece();
        } else if (state.phase === 'discard') {
          discardPiece(cur.id, aiChooseDiscard(cur.hand, cur.id).id);
        } else if (state.phase === 'can-eat') {
          (state.lastDiscard && aiShouldEat(cur.hand, state.lastDiscard, cur.id)) ? eatPiece() : skipEat();
        }
      }, delay);
    }

    // ── 遊戲狀態 ──────────────────────────────────────────
    let state = {
      deck: [], players: [], discards: [[],[],[],[]],
      currentPlayer: 0, phase: 'idle',
      drawnPieceId: null, lastDiscard: null, lastDiscardPlayer: -1,
      eaten: [], eatCount: [0,0,0,0]
    };
    let revealAll = false;
    let dealerIndex = 0;

    function newGame() {
      cancelAITurn();
      const deck = shuffle(createDeck());
      const players = [0,1,2,3].map(i=>({
        id:i, name:seatName(i), hand:[], isDealer:i===dealerIndex, isAI:seatConfig[i]==='ai'
      }));
      for (let i=0;i<4;i++) for (const p of players) p.hand.push(deck.pop());
      players.forEach(p => sortHand(p.hand));

      state = { deck, players, discards:[[],[],[],[]], currentPlayer:dealerIndex, phase:'draw',
                drawnPieceId:null, lastDiscard:null, lastDiscardPlayer:-1,
                eaten:[], eatCount:[0,0,0,0] };
      dealerIndex = (dealerIndex + 1) % 4;
      document.getElementById('win-overlay').classList.remove('show');
      document.getElementById('seat-hint').textContent = '';
      clearLog();
      addLog(`遊戲開始！${state.players.find(p=>p.isDealer).name} 為莊家，請摸牌。`);
      setStatus('');
      render();
    }

    function drawPiece() {
      if (state.phase!=='draw') return;
      if (state.deck.length===0) {
        addLog('牌堆已空，遊戲平局！');
        state.phase='idle';
        cancelAITurn();
        render();
        return;
      }
      const piece = state.deck.pop();
      const player = state.players[state.currentPlayer];
      player.hand.push(piece);
      sortHand(player.hand);
      state.drawnPieceId = piece.id;
      state.phase = 'discard';
      // AI 摸到什麼不寫進紀錄，以免玩家從側錄推回 AI 手牌
      addLog(player.isAI
        ? `${player.name} 摸牌`
        : `${player.name} 摸到「${piece.color==='red'?'紅':'黑'}${piece.type}」`);

      const result = checkWin(player.hand);
      if (result.win) {
        addLog(`${player.name} 胡牌！${result.pattern}`);
        state.phase='idle';
        cancelAITurn();
        render();
        showWin(player, result.pattern);
      } else {
        setStatus(player.isAI ? `${player.name} 思考中…` : `${player.name}，請點擊手牌打出一張`);
        render();
      }
    }

    function discardPiece(playerId, pieceId) {
      if (state.phase!=='discard' || state.currentPlayer!==playerId) return;
      const player = state.players[playerId];
      const idx = player.hand.findIndex(p=>p.id===pieceId);
      if (idx===-1) return;
      const discarded = player.hand.splice(idx,1)[0];
      state.discards[playerId].push(discarded);
      addLog(`${player.name} 打出「${discarded.color==='red'?'紅':'黑'}${discarded.type}」`);
      state.drawnPieceId = null;
      state.lastDiscard = discarded;
      state.lastDiscardPlayer = playerId;

      // 檢查其他玩家能否以此牌胡牌（依順序）
      for (let i = 1; i <= 3; i++) {
        const checkId = (playerId + i) % 4;
        const checkPlayer = state.players[checkId];
        const testHand = [...checkPlayer.hand, discarded];
        const result = checkWin(testHand);
        if (result.win) {
          const pile = state.discards[playerId];
          pile.splice(pile.findIndex(p=>p.id===discarded.id), 1);
          checkPlayer.hand.push(discarded);
          sortHand(checkPlayer.hand);
          addLog(`${checkPlayer.name} 以「${result.pattern}」胡牌（${player.name} 放砲）！`);
          state.phase = 'idle';
          state.lastDiscard = null;
          state.lastDiscardPlayer = -1;
          cancelAITurn();
          render();
          showWin(checkPlayer, result.pattern);
          return;
        }
      }

      // 無人能胡，進入下家吃牌流程
      state.currentPlayer = (playerId + 1) % 4;
      state.phase = 'can-eat';
      const next = state.players[state.currentPlayer];
      setStatus(next.isAI ? `${next.name} 思考中…` : `${next.name}，可以吃上家的牌`);
      render();
    }

    function eatPiece() {
      if (state.phase!=='can-eat' || !state.lastDiscard) return;
      const piece = state.lastDiscard;
      // 從棄牌堆移除
      const pile = state.discards[state.lastDiscardPlayer];
      const idx = pile.findIndex(p=>p.id===piece.id);
      if (idx!==-1) pile.splice(idx,1);

      const player = state.players[state.currentPlayer];
      player.hand.push(piece);
      sortHand(player.hand);
      state.eaten.push(piece);              // 已現形但不在棄牌區 → 記牌用
      state.eatCount[player.id]++;
      state.drawnPieceId = piece.id;
      state.lastDiscard = null;
      state.lastDiscardPlayer = -1;
      state.phase = 'discard';

      addLog(`${player.name} 吃了「${piece.color==='red'?'紅':'黑'}${piece.type}」`);

      const result = checkWin(player.hand);
      if (result.win) {
        addLog(`${player.name} 胡牌！${result.pattern}`);
        state.phase = 'idle';
        cancelAITurn();
        render();
        showWin(player, result.pattern);
      } else {
        setStatus(player.isAI ? `${player.name} 思考中…` : `${player.name}，吃牌後請打出一張`);
        render();
      }
    }

    function skipEat() {
      if (state.phase!=='can-eat') return;
      const player = state.players[state.currentPlayer];
      if (player.isAI) addLog(`${player.name} 不吃，改為摸牌`);
      state.lastDiscard = null;
      state.lastDiscardPlayer = -1;
      state.phase = 'draw';
      setStatus('');
      render();
    }

    // ── 渲染 ──────────────────────────────────────────────
    function render() {
      const area = document.getElementById('players-area');
      area.innerHTML='';

      const current = state.players[state.currentPlayer];
      const curIsAI = !!(current && current.isAI);

      for (const player of state.players) {
        const isActive = player.id===state.currentPlayer;
        const panel = document.createElement('div');
        panel.className = `player-panel${isActive?' active':''}`;

        const nameDiv = document.createElement('div');
        nameDiv.className='player-name';
        const thinking = isActive && player.isAI && state.phase!=='idle'
          ? ' <span class="thinking">思考中<span class="dot-anim"><span></span><span></span><span></span></span></span>'
          : '';
        nameDiv.innerHTML =
          `${player.name}` +
          `${player.isAI?' <span class="ai-badge">AI</span>':''}` +
          `${player.isDealer?' <span class="dealer-badge">莊</span>':''}` +
          ` <span style="color:#aaa;font-size:.85rem">(${player.hand.length}張)</span>` +
          thinking;
        panel.appendChild(nameDiv);

        const handDiv = document.createElement('div');
        handDiv.className='hand';

        for (const piece of player.hand) {
          const el = document.createElement('div');
          const canDiscard = isActive && state.phase==='discard' && !player.isAI;
          const isNew = piece.id===state.drawnPieceId;

          // AI 的手牌永遠蓋著（除非揭牌或結局），避免真人看光
          const showFace = (isActive && !player.isAI) || state.phase==='idle' || revealAll;
          if (showFace) {
            el.className=`piece ${piece.color}${canDiscard?' selectable':''}${isNew?' drawn':''}`;
            el.textContent=piece.type;
            el.title=piece.color==='red'?`紅${piece.type}`:`黑${piece.type}`;
            if (canDiscard) el.onclick=()=>discardPiece(player.id,piece.id);
          } else {
            el.className='piece hidden';
            el.textContent='♟';
          }
          handDiv.appendChild(el);
        }

        panel.appendChild(handDiv);
        area.appendChild(panel);
      }

      const curName = current ? current.name : '';
      const phaseLabel =
        state.phase==='idle'    ? '遊戲結束' :
        state.phase==='draw'    ? `輪到 ${curName} 摸牌` :
        state.phase==='can-eat' ? `${curName}，是否吃牌？` :
                                  `${curName} 請打出一張牌`;

      document.getElementById('turn-info').textContent=phaseLabel;
      document.getElementById('deck-count').textContent=`牌堆剩餘：${state.deck.length} 張`;
      document.getElementById('draw-btn').disabled = state.phase!=='draw' || curIsAI;
      document.getElementById('eat-controls').style.display =
        (state.phase==='can-eat' && !curIsAI) ? 'block' : 'none';

      renderSeatConfig();
      renderDiscards();
      scheduleAITurn();
    }

    function renderDiscards() {
      const rows = document.getElementById('discard-rows');
      rows.innerHTML='';
      for (let i=0;i<4;i++) {
        const row = document.createElement('div');
        row.className='discard-row';
        const label = document.createElement('span');
        label.className='discard-label';
        label.textContent=`${state.players[i] ? state.players[i].name : seatName(i)}：`;
        row.appendChild(label);
        if (state.discards[i].length===0) {
          const empty = document.createElement('span');
          empty.style.cssText='color:#555;font-size:.8rem';
          empty.textContent='尚無棄牌';
          row.appendChild(empty);
        } else {
          for (const piece of state.discards[i]) {
            const el = document.createElement('div');
            const isEatable = state.lastDiscard && piece.id===state.lastDiscard.id;
            el.className=`piece small ${piece.color}${isEatable?' eatable':''}`;
            el.textContent=piece.type;
            el.title=`${piece.color==='red'?'紅':'黑'}${piece.type}${isEatable?' （可吃）':''}`;
            row.appendChild(el);
          }
        }
        rows.appendChild(row);
      }
    }

    function showWin(player, pattern) {
      document.getElementById('win-msg').textContent=`${player.name} 以「${pattern}」胡牌！`;
      document.getElementById('win-overlay').classList.add('show');
    }

    function toggleReveal() {
      revealAll = !revealAll;
      document.getElementById('reveal-btn').textContent = revealAll ? '👁 隱藏其他手牌' : '👁 顯示全部手牌';
      render();
    }

    function setStatus(msg) { document.getElementById('status-msg').textContent=msg; }

    function addLog(msg) {
      const log=document.getElementById('log');
      const p=document.createElement('p');
      const t=new Date().toLocaleTimeString('zh-TW');
      p.textContent=`[${t}] ${msg}`;
      log.appendChild(p);
      log.scrollTop=log.scrollHeight;
    }

    function clearLog() { document.getElementById('log').innerHTML=''; }

    renderSeatConfig();
    render();
  </script>
</body>
</html>
