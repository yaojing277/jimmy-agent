<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth OS 排程執行紀錄</title>
<style>
:root{
  --ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --brand:#0f4c81;--brand-soft:#e8f1f8;
  --ok:#15803d;--ok-soft:#ecfdf5;
  --warn:#b45309;--warn-soft:#fffbeb;
  --danger:#b91c1c;--danger-soft:#fef2f2;
}
*{box-sizing:border-box;}
body{margin:0;background:#f8fafc;color:var(--ink);font-family:"Microsoft JhengHei","Segoe UI",sans-serif;line-height:1.75;}
main{max-width:1040px;margin:0 auto;background:#fff;min-height:100vh;padding:36px 40px 100px;}
h1{color:var(--brand);border-bottom:3px solid var(--brand);padding-bottom:12px;}
h1 small{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:6px;}
h2{color:var(--brand);font-size:20px;margin-top:34px;border-left:5px solid var(--brand);padding-left:10px;}
code{background:#f3f4f6;padding:1px 6px;border-radius:4px;font-family:Consolas,monospace;}
.table-wrap{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0;}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top;}
th{background:var(--brand-soft);color:#0b3a63;white-space:nowrap;}
td.nowrap{white-space:nowrap;}
.note,.must,.warn,.danger{padding:9px 14px;border-radius:6px;margin:10px 0;}
.note{background:var(--brand-soft);border-left:4px solid var(--brand);}
.must{background:var(--ok-soft);border-left:4px solid var(--ok);}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);}
.danger{background:var(--danger-soft);border-left:4px solid var(--danger);}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;}
.pill.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #a7f3d0;}
.pill.fail{background:var(--danger-soft);color:var(--danger);border:1px solid #fecaca;}
.pill.skip{background:#f3f4f6;color:var(--muted);border:1px solid var(--line);}
.pill.trig{background:var(--warn-soft);color:var(--warn);border:1px solid #fde68a;}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0;}
.stat{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:#f8fafc;}
.stat .n{font-size:26px;font-weight:700;color:var(--brand);line-height:1.2;}
.stat .l{font-size:13px;color:var(--muted);}
.steps{margin:0;padding-left:18px;font-size:13px;color:var(--muted);}
.back{display:inline-block;margin-bottom:14px;font-size:14px;color:var(--brand);text-decoration:none;}
.back:hover{text-decoration:underline;}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← 回專案總覽</a>
<h1>Wealth OS 排程執行紀錄<small>GitHub Actions <code>wealth_sync.yml</code> 每個交易日自動寫入｜倒序排列，保留最近 90 天</small></h1>

<div class="note"><b>這頁是機器產生的。</b>每次排程／手動觸發跑完後由 <code>publish_projects.py</code> 自動附加一筆，
內容為當次的目標交易日、觸發方式、執行模式與各步驟結果。人工撰寫的開發歷程請看
<a href="stock_automation_devlog.html">家族總表</a> 與 <a href="wealth_os_devlog.html">Wealth OS 開發紀錄</a>。</div>

<div class="stats" id="stats"></div>

<h2>執行明細</h2>
<div class="table-wrap">
  <table>
    <thead>
      <tr><th>目標交易日</th><th>實際執行時間</th><th>觸發</th><th>模式</th><th>結果</th><th>步驟</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" style="color:#6b7280">載入中…</td></tr></tbody>
  </table>
</div>

<hr>
<p style="color:#6b7280;font-size:13px">資料來源 <code>runlog.json</code>，由 GitHub Actions 於每次執行後更新。</p>

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;

function statusPill(s) {
  if (s === 'success') return pill('ok', '成功');
  if (s === 'skipped') return pill('skip', '跳過（非交易日）');
  return pill('fail', s || '失敗');
}

function render(runs) {
  const tbody = document.getElementById('rows');
  if (!runs.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:#6b7280">尚無紀錄。第一次排程跑完後就會出現。</td></tr>';
    return;
  }
  tbody.innerHTML = runs.map(r => `
    <tr>
      <td class="nowrap"><b>${esc(r.target_date || '—')}</b></td>
      <td class="nowrap">${esc(r.ran_at || '')}</td>
      <td class="nowrap">${pill('trig', r.trigger || '')}</td>
      <td>${esc(r.mode || '')}</td>
      <td class="nowrap">${statusPill(r.status)}</td>
      <td>${(r.steps && r.steps.length)
            ? `<ul class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`
            : '—'}</td>
    </tr>`).join('');

  const ok = runs.filter(r => r.status === 'success').length;
  const fail = runs.filter(r => r.status && r.status !== 'success' && r.status !== 'skipped').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${runs.length}</div><div class="l">保留筆數（近 90 天）</div></div>
    <div class="stat"><div class="n">${ok}</div><div class="l">成功</div></div>
    <div class="stat"><div class="n">${fail}</div><div class="l">失敗</div></div>
    <div class="stat"><div class="n">${esc(runs[0].target_date || '—')}</div><div class="l">最近一次交易日</div></div>`;
}

fetch('runlog.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => render(Array.isArray(d) ? d : (d.runs || [])))
  .catch(e => {
    document.getElementById('rows').innerHTML =
      `<tr><td colspan="6" style="color:#b91c1c">讀取 runlog.json 失敗（${esc(e)}）。若為首次部署，等第一次排程跑完即會產生。</td></tr>`;
  });
</script>
</main>
</body>
</html>
